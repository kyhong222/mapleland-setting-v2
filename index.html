<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/msicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메이플랜드 세팅 시뮬레이터 | 메랜 템 세팅</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="메이플랜드 템 세팅 시뮬레이터. 장비와 주문서를 조합해 스탯과 공격력을 미리 계산해보세요."
    />
    <meta
      name="keywords"
      content="메이플랜드, 메랜, 메이플랜드 세팅, 메랜 세팅, 세팅 시뮬레이터, 템 세팅, 아이템 시뮬레이터"
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://item.mapleland.st/" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="메이플랜드 세팅 시뮬레이터 | 메랜 템 세팅" />
    <meta
      property="og:description"
      content="메이플랜드 템 세팅 시뮬레이터. 장비와 주문서를 조합해 스탯과 공격력을 미리 계산해보세요."
    />
    <meta property="og:url" content="https://item.mapleland.st/" />
    <meta property="og:site_name" content="메이플랜드 세팅" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8260661909191975"
      crossorigin="anonymous"></script>
    <!-- 다크모드 깜빡임 방지: React가 뜨기 전에 <html>에 light/dark 클래스를 미리 단다.
         키·클래스 규칙은 src/theme.ts와 같아야 한다 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('mlsv2:colorMode') || 'system'
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
